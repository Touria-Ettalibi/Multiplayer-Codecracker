{{> header title="Benutzerverwaltung"}}

<main class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h3 mb-0">Benutzerverwaltung</h1>
    <button class="btn btn-primary" id="addUserButton">
      Benutzer hinzufügen
    </button>
  </div>

  <div id="usersError" class="alert alert-danger d-none" role="alert"></div>

  <div class="mb-3">
    <input
      type="search"
      class="form-control"
      id="searchInput"
      placeholder="Benutzername suchen …"
    >
  </div>

  <table class="table table-striped align-middle">
    <thead>
      <tr>
        <th>ID</th>
        <th>Benutzername</th>
        <th>Rolle</th>
        <th>Erstellt am</th>
        <th class="text-end">Aktionen</th>
      </tr>
    </thead>
    <tbody id="usersTableBody">
    </tbody>
  </table>
</main>

<!-- Add/edit modal -->
<div class="modal" id="userModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="userForm">
        <div class="modal-header">
          <h5 class="modal-title" id="userModalTitle">Benutzer hinzufügen</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div id="userFormError" class="alert alert-danger d-none" role="alert"></div>

          <input type="hidden" id="userId">

          <div class="mb-3">
            <label for="userUsername" class="form-label">Benutzername</label>
            <input type="text" class="form-control" id="userUsername" maxlength="50" required>
          </div>

          <div class="mb-3">
            <label for="userRole" class="form-label">Rolle</label>
            <select class="form-select" id="userRole" required>
              <option value="USER">User</option>
              <option value="ADMIN">Admin</option>
            </select>
          </div>

          <div class="mb-3">
            <label for="userPassword" class="form-label" id="userPasswordLabel">Passwort</label>
            <input type="password" class="form-control" id="userPassword" minlength="8">
            <div class="form-text" id="userPasswordHint">Mindestens 8 Zeichen.</div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Abbrechen</button>
          <button type="submit" class="btn btn-primary">Speichern</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script type="module" src="/src/require-admin.ts"></script>
<script type="module" src="/src/users.ts"></script>

{{> footer}}
